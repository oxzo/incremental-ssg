# The suite as a merge gate rather than a thing someone remembers to run.
#
# When this file was added the repository had 264 tests, 35 mutations and no CI,
# which means every one of those was evidence about one machine at one moment.
# The point of this file is not more checking — it is the same checking,
# enforced.
#
# Those two numbers describe that moment and are not maintained; both have grown
# a long way since. Said explicitly because a review has already read them as a
# count of the current suite and filed the difference as documentation drift —
# which is the right instinct, and the reason the README no longer quotes a
# count at all. `npm test` and `npm run test:mutate` below print the live ones.
#
# Two Node versions: the minimum `engines` claims, because a claim nobody tests
# is a guess, and current, because that is what a new contributor will have.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 is the floor package.json declares. Pinned exactly rather than
        # `22.x`, because the floor is the thing being tested — `22.x` would
        # quietly test whatever 22 release is current and prove nothing about it.
        node: ['22.18.0', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: type check
        run: npm run typecheck

      # demo/worker is its own npm package with its own lockfile, so the root
      # `npm ci` does not install it. Checking it needs its devDependencies
      # present -- which the first CI run discovered, having passed locally only
      # because a previous manual install had left them on the machine. That is
      # the whole argument for this file in one step.
      - name: install demo worker deps
        run: npm ci --prefix demo/worker

      - name: type check the demo worker
        run: npm run typecheck:worker

      - name: tests
        run: npm test

      # Vulnerabilities in devDependencies do not ship. Runtime ones do.
      - name: audit runtime dependencies
        run: npm audit --omit=dev

  mutate:
    # Separate job, and not because it is optional. It takes minutes where the
    # suite takes seconds, and running it beside the tests would make every push
    # wait on it. A green suite that has never been observed failing has
    # unmeasured failure behaviour, which is the whole argument for the harness;
    # it is a gate, just a slower one.
    runs-on: ubuntu-latest
    name: mutations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci

      # Every mutation, no exclusions. s3-truncated-listing-accepted was excluded
      # here by name until the listing loop got a request cap: under it the loop
      # never terminated, outlived the test that timed out on it, and hung the
      # run about one time in six. The cap bounds the mutated loop as well as the
      # real one, which is most of what it is for.
      - name: mutation harness
        run: npm run test:mutate
